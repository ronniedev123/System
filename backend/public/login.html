<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ministry of Repentance and Holiness</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0f6ecf">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Church App">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body class="auth-page">
    <main class="auth-shell auth-shell-single">
        <section class="auth-panel auth-card">
            <div class="auth-media-panel">
                <video autoplay muted loop playsinline poster="assets/ssstik.io_@brian_kiverenge_1777289787251.mp4">
                    <source src="assets/ssstik.io_@brian_kiverenge_1777289787251.mp4" type="video/mp4">
                </video>
                <div class="auth-media-fallback">
                    <img src="assets/logo.jpeg" alt="Umoja Main Altar logo">
                    <p>Umoja Main Altar</p>
                    <span>Actual church media will appear here when added.</span>
                </div>
            </div>
            <div class="auth-card-body">
                <div class="top">
                    <span class="auth-badge">Login</span>
                    <div class="cross">✝</div>
                    <h1>Welcome back</h1>
                    <p class="auth-subtitle">
                        Sign in to continue to your dashboard, review ministry records, and manage church activity in one secure place.
                    </p>
                </div>
                <form id="loginForm">
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p id="error"></p>
                </form>
                <div class="auth-card-footer">
                    <span>New here?</span>
                    <a class="auth-button secondary" href="register.html">Create Account</a>
                </div>
                <div class="links">
                    <a href="index.html">Back to Welcome</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
